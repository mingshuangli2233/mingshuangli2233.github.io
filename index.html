<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>下载 · 极致体验</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0e1a;
            overflow: hidden;
            padding: 20px;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 700px;
            background: rgba(20, 28, 58, 0.55);
            backdrop-filter: blur(24px) saturate(1.3);
            -webkit-backdrop-filter: blur(24px) saturate(1.3);
            border-radius: 56px;
            padding: 48px 40px 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .card:hover {
            transform: translateY(-6px) scale(1.003);
        }

        .card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 56px;
            padding: 1px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.12), transparent 50%, rgba(255, 255, 255, 0.02));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header .icon-big {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 84px;
            height: 84px;
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(168, 85, 247, 0.15));
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 40px;
            color: #a78bfa;
            box-shadow: 0 12px 32px rgba(99, 102, 241, 0.15);
            margin-bottom: 16px;
            transition: transform 0.4s ease;
        }

        .card:hover .icon-big {
            transform: scale(1.04) rotate(-2deg);
        }

        .header h1 {
            font-size: 34px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .sub {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 6px;
            letter-spacing: 0.3px;
            font-weight: 400;
        }

        .header .sub i {
            color: #a78bfa;
            margin: 0 4px;
        }

        .version-tag {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 28px;
            letter-spacing: 0.5px;
        }
        .version-tag span {
            color: #a78bfa;
            font-weight: 600;
        }

        .platform-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 30px;
        }

        .platform-btn {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px 24px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            text-decoration: none;
            color: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .platform-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 0.06), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }
        .platform-btn:hover::after {
            opacity: 1;
        }

        .platform-btn:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .platform-btn:active {
            transform: scale(0.97);
        }

        .platform-btn .p-icon {
            font-size: 32px;
            flex-shrink: 0;
            width: 48px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .platform-btn:hover .p-icon {
            transform: scale(1.08) rotate(-3deg);
        }

        .platform-btn .p-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            line-height: 1.3;
        }
        .platform-btn .p-info .p-name {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.2px;
        }
        .platform-btn .p-info .p-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.35);
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 2px;
        }
        .platform-btn .p-info .p-desc .tag {
            background: rgba(255, 255, 255, 0.04);
            padding: 1px 12px;
            border-radius: 20px;
            font-size: 11px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.2);
        }

        .platform-btn .p-arrow {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.15);
            transition: transform 0.3s ease;
        }
        .platform-btn:hover .p-arrow {
            transform: translateX(4px);
            color: rgba(255, 255, 255, 0.4);
        }

        .btn-android .p-icon {
            color: #34d399;
        }
        .btn-android:hover {
            border-color: rgba(52, 211, 153, 0.2);
            box-shadow: 0 8px 32px rgba(52, 211, 153, 0.06);
        }

        .btn-ios .p-icon {
            color: #93c5fd;
        }
        .btn-ios:hover {
            border-color: rgba(147, 197, 253, 0.2);
            box-shadow: 0 8px 32px rgba(147, 197, 253, 0.06);
        }

        .service-wrapper {
            display: flex;
            justify-content: center;
            margin: 6px 0 18px;
        }

        .service-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 12px 28px 12px 24px;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.35s ease;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            position: relative;
        }

        .service-btn i.fa-qq {
            font-size: 22px;
            color: #4d9aff;
            transition: transform 0.3s ease;
        }

        .service-btn .badge-hot {
            background: #ef4444;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 30px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.25);
            animation: pulse-badge 2s infinite;
        }

        @keyframes pulse-badge {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.3); }
            70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .service-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .service-btn:hover i.fa-qq {
            transform: scale(1.12) rotate(-6deg);
        }

        .service-btn:active {
            transform: scale(0.96);
        }

        .footer-meta {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            flex-wrap: wrap;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .footer-meta .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.3px;
        }

        .footer-meta .meta-item i {
            font-size: 13px;
            color: rgba(167, 139, 250, 0.3);
        }

        .footer-meta .meta-item .hl {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 500;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: rgba(20, 28, 58, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #fff;
            padding: 14px 32px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 9999;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .toast i {
            font-size: 18px;
            opacity: 0.7;
        }

        @media (max-width: 600px) {
            .card {
                padding: 32px 20px 28px;
                border-radius: 40px;
            }
            .header h1 {
                font-size: 28px;
            }
            .header .icon-big {
                width: 68px;
                height: 68px;
                font-size: 32px;
            }
            .platform-btn {
                padding: 14px 18px;
                gap: 14px;
                border-radius: 20px;
            }
            .platform-btn .p-icon {
                font-size: 26px;
                width: 40px;
            }
            .platform-btn .p-info .p-name {
                font-size: 16px;
            }
            .platform-btn .p-info .p-desc {
                font-size: 12px;
            }
            .service-btn {
                padding: 10px 20px;
                font-size: 14px;
            }
            .service-btn i.fa-qq {
                font-size: 18px;
            }
            .footer-meta {
                gap: 16px;
            }
            .footer-meta .meta-item {
                font-size: 11px;
            }
            .toast {
                font-size: 13px;
                padding: 10px 20px;
                white-space: normal;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 24px 14px 20px;
                border-radius: 32px;
            }
            .header h1 {
                font-size: 24px;
            }
            .platform-btn {
                padding: 12px 14px;
                gap: 10px;
            }
            .platform-btn .p-icon {
                font-size: 22px;
                width: 34px;
            }
            .platform-btn .p-info .p-name {
                font-size: 14px;
            }
            .service-btn {
                font-size: 13px;
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <div class="card" role="main">

        <div class="header">
            <div class="icon-big">
                <i class="fas fa-cloud-download-alt"></i>
            </div>
            <h1>AI 新统计</h1>
            <div class="sub">
                <i class="fas fa-shield-alt"></i> 安全 · 高效 · 跨平台
            </div>
        </div>

        <div style="text-align:center;">
            <span class="version-tag">
                <i class="fas fa-tag" style="margin-right:6px;"></i> 最新版本 <span>v2027</span>
            </span>
        </div>

        <div class="platform-list">

            <a href="#" class="platform-btn btn-android" id="androidBtn">
                <span class="p-icon"><i class="fab fa-android"></i></span>
                <span class="p-info">
                    <span class="p-name">Android</span>
                    <span class="p-desc">
                        <span class="tag">.apk</span>
                        已签名 · 直接安装
                    </span>
                </span>
                <span class="p-arrow"><i class="fas fa-chevron-right"></i></span>
            </a>

            <a href="#" class="platform-btn btn-ios" id="iosBtn">
                <span class="p-icon"><i class="fab fa-apple"></i></span>
                <span class="p-info">
                    <span class="p-name">iPhone / iPad</span>
                    <span class="p-desc">
                        <span class="tag">.mobileconfig</span>
                        Safari 安装描述文件
                    </span>
                </span>
                <span class="p-arrow"><i class="fas fa-chevron-right"></i></span>
            </a>

        </div>

        <div class="service-wrapper">
            <a href="#" class="service-btn" id="serviceBtn">
                <i class="fab fa-qq"></i>
                <span>联系客服</span>
                <span class="badge-hot">客服1号</span>
                <i class="fas fa-chevron-right" style="font-size:12px; opacity:0.3; margin-left:4px;"></i>
            </a>
        </div>

        <div class="footer-meta">
            <span class="meta-item"><i class="fas fa-check-circle"></i> <span class="hl">Android 8+</span> · <span class="hl">iOS 14+</span></span>
            <span class="meta-item"><i class="fas fa-database"></i> 大小 <span class="hl">14.6 MB</span></span>
            <span class="meta-item"><i class="fas fa-lock"></i> 端到端加密</span>
        </div>

    </div>

    <div class="toast" id="toast">
        <i class="fas fa-circle-notch fa-spin"></i>
        <span id="toastMsg">加载中...</span>
    </div>

    <script>
        (function() {
            'use strict';

            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            const PARTICLE_COUNT = 120;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * 2 + 0.5;
                    this.speedX = (Math.random() - 0.5) * 0.3;
                    this.speedY = (Math.random() - 0.5) * 0.3;
                    this.opacity = Math.random() * 0.5 + 0.1;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0 || this.x > width) this.speedX *= -1;
                    if (this.y < 0 || this.y > height) this.speedY *= -1;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                    ctx.fill();
                }
            }

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }

            function drawParticles() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 150) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(255, 255, 255, ${0.06 * (1 - dist / 150)})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(drawParticles);
            }
            drawParticles();

            const btns = document.querySelectorAll('.platform-btn, .service-btn');
            btns.forEach(btn => {
                btn.addEventListener('mousemove', (e) => {
                    const rect = btn.getBoundingClientRect();
                    const x = ((e.clientX - rect.left) / rect.width) * 100;
                    const y = ((e.clientY - rect.top) / rect.height) * 100;
                    btn.style.setProperty('--x', x + '%');
                    btn.style.setProperty('--y', y + '%');
                });
                btn.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    if (!touch) return;
                    const rect = btn.getBoundingClientRect();
                    const x = ((touch.clientX - rect.left) / rect.width) * 100;
                    const y = ((touch.clientY - rect.top) / rect.height) * 100;
                    btn.style.setProperty('--x', x + '%');
                    btn.style.setProperty('--y', y + '%');
                });
            });

            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            let toastTimer = null;

            function showToast(message, iconClass) {
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toastTimer = null;
                }
                toast.classList.remove('show');
                void toast.offsetWidth;

                toastMsg.textContent = message;
                const iconEl = toast.querySelector('i');
                if (iconEl) {
                    iconEl.className = iconClass || 'fas fa-circle-notch fa-spin';
                }

                toast.classList.add('show');

                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                    toastTimer = null;
                }, 2800);
            }

            const androidBtn = document.getElementById('androidBtn');
            const iosBtn = document.getElementById('iosBtn');

            const ANDROID_DOWNLOAD_URL = 'https://dl-e.feejii.com/storage/files/2026/09/05/1/5167812801/17885611097341.gz?t=6a9b4e19&rlimit=20&us=XWAXHgH4i3&sign=535af6e06a2b454341b18002a3026d8b&download_name=_______v2027.APK&p=null-14691647-58570426131';
            const IOS_DOWNLOAD_URL = 'https://kf-c.dinghaoinc.com/202609050612/4a64c716d1cb1cb9d3f64c90d99a6ccd/storage/files/2026/09/05/1/5167812801/17885412692951.gz?filename=%D0%A2%D0%B5%D1%82%D1%80%D0%B8%D1%81-ios.mobileconfig&p=null-14691647-58553755659';

            function handleDownload(event, platform) {
                event.preventDefault();
                const btn = event.currentTarget;
                btn.style.transform = 'scale(0.96)';
                setTimeout(() => {
                    btn.style.transform = '';
                }, 150);

                if (platform === 'android') {
                    showToast('开始下载 Android 安装包...', 'fas fa-download');
                    setTimeout(() => {
                        window.location.href = ANDROID_DOWNLOAD_URL;
                    }, 400);
                } else if (platform === 'ios') {
                    showToast('开始下载 iOS 描述文件...', 'fas fa-download');
                    setTimeout(() => {
                        window.location.href = IOS_DOWNLOAD_URL;
                    }, 400);
                }
            }

            androidBtn.addEventListener('click', (e) => handleDownload(e, 'android'));
            iosBtn.addEventListener('click', (e) => handleDownload(e, 'ios'));

            const serviceBtn = document.getElementById('serviceBtn');
            const QQ_NUMBER = '690042358';

            serviceBtn.addEventListener('click', function(e) {
                e.preventDefault();

                const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

                showToast('正在打开QQ客服...', 'fab fa-qq');

                this.style.transform = 'scale(0.96)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 150);

                if (isMobile) {
                    const mobileUrl = 'mqqwpa://im/chat?chat_type=wpa&version=1&src_type=web&web_src=oicqzone.com&uin=' + QQ_NUMBER;
                    window.location.href = mobileUrl;
                    setTimeout(() => {
                        const fallbackUrl = 'https://wpa.qq.com/msgrd?v=3&site=qq&menu=yes&uin=' + QQ_NUMBER;
                        window.location.href = fallbackUrl;
                    }, 1500);
                } else {
                    const pcUrl = 'tencent://message/?uin=' + QQ_NUMBER + '&Site=qq&Menu=yes';
                    window.location.href = pcUrl;
                }
            });

            serviceBtn.setAttribute('role', 'button');
            serviceBtn.setAttribute('tabindex', '0');
            serviceBtn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    serviceBtn.click();
                }
            });

            document.querySelectorAll('.platform-btn').forEach(link => {
                link.setAttribute('role', 'button');
                link.setAttribute('tabindex', '0');
                link.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        link.click();
                    }
                });
            });

        })();
    </script>

</body>
</html>
