function queryPrize() {
    const macauNum = parseInt(document.getElementById('macauNumber').value, 10);
    const hkNum = parseInt(document.getElementById('hongkongNumber').value, 10);
    const latestDate = getLatestDateFromHistory();
    if (!latestDate) {
        document.getElementById('prizeResultArea').innerHTML = '<div style="text-align: center; padding: 20px; color: #7f8c8d;">暂无历史记录，请先下注</div>';
        currentPrizeData = { macau: { records: [], total: 0, pingteTotal: 0, pingteSxBetTotal:0, pingteTailBetTotal:0, forecastNet: 0 }, hongkong: { records: [], total: 0, pingteTotal: 0, pingteSxBetTotal:0, pingteTailBetTotal:0, forecastNet: 0 } };
        updatePrizeUIForRegion(currentDisplayRegionPrize);
        return;
    }
    const panelExpanded = isPingtePanelExpanded();
    let macauSxList = panelExpanded ? collectSxFromPanel('macau') : [];
    let hkSxList = panelExpanded ? collectSxFromPanel('hongkong') : [];
    let macauTailList = panelExpanded ? collectTailFromPanel('macau') : [];
    let hkTailList = panelExpanded ? collectTailFromPanel('hongkong') : [];
    if (panelExpanded) {
        if (!isNaN(macauNum) && macauNum >= 1 && macauNum <= 49) {
            const macauSx = zodiacMap[macauNum];
            if (macauSx && !macauSxList.includes(macauSx)) macauSxList.push(macauSx);
            const macauTail = macauNum % 10;
            if (!macauTailList.includes(macauTail)) macauTailList.push(macauTail);
        }
        if (!isNaN(hkNum) && hkNum >= 1 && hkNum <= 49) {
            const hkSx = zodiacMap[hkNum];
            if (hkSx && !hkSxList.includes(hkSx)) hkSxList.push(hkSx);
            const hkTail = hkNum % 10;
            if (!hkTailList.includes(hkTail)) hkTailList.push(hkTail);
        }
    }
    function filterRecords(region, num, sxList, tailList) {
        if (isNaN(num) || num < 1 || num > 49) return { records: [], total: 0, pingteTotal: 0, pingteSxBetTotal:0, pingteTailBetTotal:0, forecastNet: 0 };
        const matched = [];
        let totalWin = 0;
        let pingteTotal = 0;
        let forecastNet = 0;
        let pingteSxBetTotal = 0, pingteTailBetTotal = 0;
        for (let rec of historyRecords) {
            if (rec.region !== region) continue;
            if (!isSameDate(rec.timestamp, latestDate)) continue;
            if (isMixedRegionRecord(rec.description)) continue;
            const isDeduction = rec.description.startsWith('📤') || (rec.description.startsWith('📝') && rec.description.includes('手动扣减'));
            if (rec.description.startsWith('📝 恢复投注') || rec.description.startsWith('📤 删除投注')) {
    continue;
}
            if (isDeduction) {
                const { deductionItems, totalDeduct } = parseDeductionRecord(rec.description);
                let offsetAmount = 0;
                for (let it of deductionItems) {
                    if (it.type === 'number') {
                        if (it.key === num) offsetAmount += it.amount * oddsMultiplier;
                    } else if (it.type === 'shengxiao') {
                        if (sxList.includes(it.key)) {
                            const isSpecial = isSpecialZodiac(it.key);
                            const odds = isSpecial ? PINGTE_TAIL_ODDS : PINGTE_SX_ODDS;
                            offsetAmount += it.amount * odds;
                        }
                    } else if (it.type === 'tail') {
                        if (tailList.includes(it.key)) {
                            const odds = (it.key === SPECIAL_TAIL_NUMBERS) ? PINGTE_SX_ODDS : PINGTE_TAIL_ODDS;
                            offsetAmount += it.amount * odds;
                        }
                    }
                }
                forecastNet += (totalDeduct - offsetAmount);
                continue;
            }
            if (!rec.description.startsWith('📝')) continue;
            let cleanDesc = rec.description.replace(/^[📝📤]+\s*(添加投注|上报扣减)\s*/, '').trim();
            const lines = cleanDesc.split(/\r?\n/);
            let recWin = 0;
            let recPingteWin = 0;
            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                const parsed = parseRecordDescription(line);
                if (!parsed) continue;
                if (parsed.type === 'pingte_shengxiao') {
                    const amount = parsed.price;
                    if (isSpecialZodiac(parsed.zodiac)) {
                        pingteTailBetTotal += amount;
                    } else {
                        pingteSxBetTotal += amount;
                    }
                    if (sxList.includes(parsed.zodiac)) recPingteWin += amount;
                } else if (parsed.type === 'pingte_tail') {
                    const amount = parsed.price;
                    if (parsed.tail === 0) {
                        pingteSxBetTotal += amount;
                    } else {
                        pingteTailBetTotal += amount;
                    }
                    if (tailList.includes(parsed.tail)) recPingteWin += amount;
                } else if (parsed.type === 'normal') {
                    for (let n of parsed.numbers) {
                        if (n === num) recWin += parsed.price;
                    }
                }
            }
            matched.push({
                region: region === 'macau' ? '澳门' : '香港',
                cleanDesc: cleanDesc,
                totalAmount: rec.totalAmount,
                timestamp: rec.timestamp,
                winAmount: recWin,
                pingteWinAmount: recPingteWin
            });
            totalWin += recWin;
            pingteTotal += recPingteWin;
        }
        return { records: matched, total: totalWin, pingteTotal: pingteTotal, pingteSxBetTotal, pingteTailBetTotal, forecastNet: forecastNet };
    }
    const macauResult = filterRecords('macau', macauNum, macauSxList, macauTailList);
    const hongkongResult = filterRecords('hongkong', hkNum, hkSxList, hkTailList);
    currentPrizeData = {
        macau: { records: macauResult.records, total: macauResult.total, pingteTotal: macauResult.pingteTotal, pingteSxBetTotal: macauResult.pingteSxBetTotal, pingteTailBetTotal: macauResult.pingteTailBetTotal, forecastNet: macauResult.forecastNet },
        hongkong: { records: hongkongResult.records, total: hongkongResult.total, pingteTotal: hongkongResult.pingteTotal, pingteSxBetTotal: hongkongResult.pingteSxBetTotal, pingteTailBetTotal: hongkongResult.pingteTailBetTotal, forecastNet: hongkongResult.forecastNet }
    };
    let defaultRegion = 'macau';
    if (macauResult.records.length === 0 && hongkongResult.records.length > 0) defaultRegion = 'hongkong';
    else if (macauResult.records.length === 0 && hongkongResult.records.length === 0) defaultRegion = 'macau';
    currentDisplayRegionPrize = defaultRegion;
    updatePrizeUIForRegion(currentDisplayRegionPrize);
    updateTotalWinButtonForRegion();
    updateToggleButtonState();
}

function updatePrizeUIForRegion(region) {
    const data = currentPrizeData[region];
    const container = document.getElementById('prizeResultArea');
    if (!data) {
        container.innerHTML = '<div style="text-align: center; padding: 20px; color: #7f8c8d;">未找到数据</div>';
        updateTotalWinButtonForRegion();
        return;
    }

    const totalBet = data.records.reduce((sum, rec) => sum + rec.totalAmount, 0);
    const totalSpecialWin = data.total;
    const totalPingteWin = data.pingteTotal;
    const specialPayout = totalSpecialWin * oddsMultiplier;
    const normalWater = (totalBet - (data.pingteSxBetTotal + data.pingteTailBetTotal)) * waterRate;
    const pingteSxWater = (data.pingteSxBetTotal || 0) * pingteSxWaterRate;
    const pingteTailWater = (data.pingteTailBetTotal || 0) * pingteTailWaterRate;
    const totalWater = normalWater + pingteSxWater + pingteTailWater;
    const net = totalBet - specialPayout - totalPingteWin - totalWater;

    let html = '';

    const winningRecords = data.records.filter(rec => rec.winAmount > 0 || rec.pingteWinAmount > 0);
    if (data.records.length === 0) {
        html += '<div style="text-align: center; padding: 20px; color: #7f8c8d;">未找到投注记录</div>';
    } else if (winningRecords.length === 0) {
        html += '<div style="text-align: center; padding: 20px; color: #7f8c8d;">本期无中奖项目</div>';
    } else {
        winningRecords.forEach(res => {
            const regionIcon = res.region === '澳门' ? '🇲🇴' : '🇭🇰';
            let winDetails = '';
            if (res.winAmount > 0) winDetails += `<div style="margin-bottom: 2px;">特码中 <span style="color:#c0392b;">${res.winAmount}</span> 元</div>`;
            if (res.pingteWinAmount > 0 && isPingtePanelExpanded()) {
                winDetails += `<div style="margin-top: 0;">平特中 <span style="color:#2c6e2c;">${res.pingteWinAmount}</span> 元</div>`;
            }
            const fullDesc = `${regionIcon} ${res.region}${res.cleanDesc}`;
            html += `<div class="history-item"><div class="history-left"><div class="history-desc" style="font-family: inherit; white-space: pre-wrap;">${escapeHtml(fullDesc)}</div></div><div class="history-right"><span class="history-amount">💰 ${res.totalAmount.toLocaleString()}</span><span class="history-time">${res.timestamp}</span>${winDetails ? `<div style="margin-top:6px;">${winDetails}</div>` : ''}</div></div>`;
        });
    }

    html += `<div id="prizeCopyBtnContainer" style="text-align: center; margin-top: 16px; padding: 10px; border-top: 1px dashed #ccc;"></div>`;
    container.innerHTML = html;

    const btnContainer = document.getElementById('prizeCopyBtnContainer');
    if (btnContainer) {
        const copyBtn = document.createElement('span');
        copyBtn.style.cssText = 'color: #2c6e2c; font-weight: bold; cursor: pointer; background: #e8f5e9; padding: 6px 20px; border-radius: 30px;';
        copyBtn.innerText = '📄 复制记录';
        copyBtn.addEventListener('click', exportPrizeToTxt);
        btnContainer.appendChild(copyBtn);

        const imgBtn = document.createElement('span');
        imgBtn.style.cssText = 'color: #fff; background: #d4af37; margin-left: 12px; padding: 6px 20px; border-radius: 30px; cursor: pointer; font-weight: bold;';
        imgBtn.innerText = '📸 导出图片';
        imgBtn.addEventListener('click', () => exportPrizeAsImage(region));
        btnContainer.appendChild(imgBtn);
    }

    updateTotalWinButtonForRegion();
}

function bindNumberInputRestriction(inputElem, autoJump = false, nextInputGetter = null) {
    if (!inputElem) return;
    inputElem.addEventListener('input', function(e) {
        let val = this.value.trim();

        if (!/^\d*$/.test(val)) {
            this.value = val.replace(/\D/g, '');
            return;
        }

        if (val.length > 2) {
            this.value = val.slice(0, 2);
            val = this.value;
        }

        if (autoJump && val.length === 2) {
            let num = parseInt(val, 10);
            if (!isNaN(num) && num >= 1 && num <= 49 && nextInputGetter) {
                let next = nextInputGetter(this);
                if (next && next !== this) {
                    next.focus();
                }
            }
        }
    });
    inputElem.addEventListener('blur', function() {
        let val = this.value.trim();
        if (val === '') return;
        let num = parseInt(val, 10);
        if (isNaN(num) || num < 1 || num > 49) {
            this.value = '';
            return;
        }
        this.value = pad2(num);
    });
}

// ==================== 15. 手势与全屏显示 ====================
let initialPinchDistance = 0, pinchTriggered = false;
const tableZone = document.getElementById('tableGestureZone');

function getPinchDistance(e) {
    if (!e.touches || e.touches.length<2) return 0;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    return Math.hypot(dx,dy);
}

function onTouchStart(e) {
    if (e.touches.length===2) {
        initialPinchDistance = getPinchDistance(e);
        pinchTriggered = false;
    }
}

function onTouchMove(e) {
    if (e.touches.length===2 && !pinchTriggered && initialPinchDistance>0 && getPinchDistance(e) > initialPinchDistance*1.12) {
        e.preventDefault();
        pinchTriggered=true;
        showFullNumbersOverlay();
        initialPinchDistance=0;
    }
}

function onTouchEnd(e) {
    if (e.touches.length<2) {
        initialPinchDistance=0;
        pinchTriggered=false;
    }
}

function loadGlobalSettings() {
    const stored = localStorage.getItem('global_odds_v4');
    if (stored) try {
        const cfg = JSON.parse(stored);
        if (typeof cfg.oddsMultiplier === 'number') oddsMultiplier = cfg.oddsMultiplier;
        if (typeof cfg.waterRate === 'number') waterRate = cfg.waterRate;
        if (typeof cfg.pingteSxWaterRate === 'number') pingteSxWaterRate = cfg.pingteSxWaterRate;
        if (typeof cfg.pingteTailWaterRate === 'number') pingteTailWaterRate = cfg.pingteTailWaterRate;
    } catch(e) {}
}

(function () {
    var tabs = ['macau', 'hongkong'];
    var startX = 0;
    var endX = 0;
    function getCurrentTab() {
        var active = document.querySelector('.nav-item.active');
        return active ? active.dataset.tab : 'macau';
    }
    function switchBySwipe(direction) {
        var current = getCurrentTab();
        var index = tabs.indexOf(current);
        if (direction === 'left') {
            if (current === 'hongkong') {
                if (typeof PingteManager !== 'undefined' && PingteManager.open) {
                    PingteManager.open();
                    vibrate && vibrate('tab');
                }
                return;
            }
            index++;
        } else if (direction === 'right') {
            index--;
        }
        if (index < 0 || index >= tabs.length) return;
        switchTab(tabs[index]);
    }
    document.addEventListener('touchstart', function (e) {
        startX = e.touches[0].clientX;
    }, { passive: true });
    document.addEventListener('touchend', function (e) {
        endX = e.changedTouches[0].clientX;
        var diff = endX - startX;
        if (Math.abs(diff) < 80) return;
        if (diff > 0) {
            switchBySwipe('right');
        } else {
            switchBySwipe('left');
        }
    });
})();

async function showRegisterUIWithCallback(onSuccess) {
    if (document.getElementById('registerOverlay')) return;
    const machineFull = await getMachineCode();
    const machineDisplay = machineFull.substring(0, 8).toUpperCase();
    const overlay = document.createElement('div');
    overlay.id = 'registerOverlay';
    overlay.className = 'register-overlay';
    overlay.innerHTML = `<div class="register-card"><h2>🔐 软件授权</h2><p style="font-size:0.85rem; margin-bottom:8px;"></p><div class="machine-code">机器码：${machineDisplay}</div><input type="text" id="regCodeInput" placeholder="请输入注册码" autocomplete="off"><button id="verifyRegBtn">✅ 验证注册</button><button id="copyFullMachineBtn" class="copy-full-btn">📋 复制机器码</button><button id="closeRegBtn" style="background:#ccc; margin-top:8px;">关闭</button><div id="regErrorMsg" class="error-msg"></div><div style="font-size:0.7rem; margin-top:12px; opacity:0.7;">* 联系作者获取注册码</div></div>`;
    document.body.appendChild(overlay);

    const inputField = document.getElementById('regCodeInput');
    const verifyBtn = document.getElementById('verifyRegBtn');
    const errorDiv = document.getElementById('regErrorMsg');
    const copyFullBtn = document.getElementById('copyFullMachineBtn');
    const closeBtn = document.getElementById('closeRegBtn');

    async function copyMachineCode() {
        const fullCode = localStorage.getItem(STORAGE_MACHINE_HASH);
        if (fullCode && fullCode.length === 64) return await safeCopyText(fullCode.toUpperCase());
        return false;
    }

    copyFullBtn.addEventListener('click', async () => {
        const success = await copyMachineCode();
        if (success) {
            const originalText = copyFullBtn.innerText;
            copyFullBtn.innerText = '✅ 已复制！';
            setTimeout(() => { copyFullBtn.innerText = originalText; }, 1500);
        } else alert('复制失败，请手动复制机器码');
    });

    const verify = async () => {
        const userCode = inputField.value.trim().toUpperCase();
        if (!userCode) {
            errorDiv.innerText = '请输入注册码';
            return;
        }
        const machineFull = await getMachineCode();
        const expected = await calculateExpectedRegCode(machineFull);
        if (userCode === expected) {
            errorDiv.innerText = '✅ 验证成功！';
            localStorage.setItem(STORAGE_REG_KEY, 'true');
            localStorage.setItem('actual_reg_code', userCode);
            overlay.remove();
            if (onSuccess) onSuccess();
        } else {
            errorDiv.innerText = '❌ 注册码错误，请核对后重试';
            inputField.value = '';
            inputField.focus();
        }
    };
    verifyBtn.addEventListener('click', verify);
    inputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') verify(); });
    closeBtn.addEventListener('click', () => overlay.remove());
}

(async function() {
    const isReg = await isRegisteredValid();
    if (isReg) {
        startApp();
        return;
    }

    const todayStr = getTodayStr();
    
    if (todayStr < BAN_TRIAL_BEFORE_DATE) {
        await showRegisterUI();
        return;
    }
    
    const isGlobalExpired = todayStr >= LICENSE_EXPIRE_DATE;
    if (isGlobalExpired) {
        await showMandatoryRegisterUI();
        location.reload();
        return;
    }

    let firstUse = getFirstUseDate();
    if (!firstUse) {
        setFirstUseDate(todayStr);
        firstUse = todayStr;
    }

    const diffDays = Math.floor((new Date(todayStr) - new Date(firstUse)) / (1000 * 3600 * 24));
    if (diffDays < TRIAL_DAYS) {
        await showLetterStartup();
        startApp();
    } else {
        await showMandatoryRegisterUI();
        location.reload();
    }
