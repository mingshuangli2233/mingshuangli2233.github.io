            if (touchStartTarget) {
                const id = touchStartTarget.getAttribute('data-id');
                handleHistoryItemDelete(id);
                touchStartTarget = null;
            }
            longPressTimer = null;
        }, 600);
    }, { passive: true });

    historyContainer.addEventListener('touchmove', () => {
        if (longPressTimer) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
        }
        touchStartTarget = null;
    });

    historyContainer.addEventListener('touchend', () => {
        if (longPressTimer) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
        }
        touchStartTarget = null;
    });

    historyContainer.addEventListener('touchcancel', () => {
        if (longPressTimer) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
        }
        touchStartTarget = null;
    });
}

// ==================== 12. 解析器核心 ====================
function extractPrice(raw) {
    let s = trim(raw);
    if (!s) return 0;
    s = fullToHalf(s);
    s = s.replace(/[斤元块注份米井#￥¥号]+$/, '').replace(/(澳门|澳|奥|门)$/, '');
    let m = s.match(/^([零一两二三四五六七八九十百千万]+|\d+)/);
    if (m) {
        let n = parseInt(m[1], 10);
        return !isNaN(n) ? n : chineseToNumber(m[1]);
    }
    return chineseToNumber(s);
}

function extractPriceNumber(str) {
    let s = str.trim();
    if (!s) return 0;
    let num = parseInt(s, 10);
    if (!isNaN(num)) return num;
    return chineseToNumber(s);
}

function splitFourDigitNumbers(desc) {
    return desc.replace(/(\d{2})(\d{2})/g, (match, p1, p2) => {
        let n1 = parseInt(p1, 10), n2 = parseInt(p2, 10);
        if (n1 >= 1 && n1 <= 49 && n2 >= 1 && n2 <= 49) return p1 + ' ' + p2;
        return match;
    });
}

function cleanDescPrefix(desc) {
    return desc.replace(/^(奥特|澳特|香特|门特|买澳门的|今晚买澳门|买澳门的|澳门|澳|奥门特码|门|买|下注|特码|特|包|斤|元|#|＃|[a-zA-Z]+)/g, '').trim();
}

function preprocessMultiLineNumberBlocks(text) {
    if (!text) return text;
    const lines = text.split(/\r?\n/);
    const result = [];
    let i = 0;
    const n = lines.length;

    const isNumberLine = (l) => /^[\d\s\/\.\,\-\_]+$/.test(l);

    const extractPriceLocal = (amountLine) => {
        let price = 0;
        if (amountLine.includes('各')) {
            let parts = amountLine.split('各');
            if (parts.length >= 2) {
                let priceStr = parts[1].trim();
                priceStr = priceStr.replace(/[米元块斤井注码份]$/, '');
                price = chineseToNumber(priceStr);
            }
        } else {
            let match = amountLine.match(/(\d+|[零一两二三四五六七八九十百千万]+)[米元块斤]?$/);
            if (match) {
                let priceStr = match[1];
                price = chineseToNumber(priceStr);
            } else {
                let pureNum = parseInt(amountLine, 10);
                if (!isNaN(pureNum)) price = pureNum;
            }
        }
        return price > 0 ? price : 0;
    };

    while (i < n) {
        let line = lines[i].trim();
        if (!line) {
            result.push('');
            i++;
            continue;
        }
        if (isNumberLine(line)) {
            let numberLines = [line];
            let j = i + 1;
            while (j < n && isNumberLine(lines[j].trim())) {
                numberLines.push(lines[j].trim());
                j++;
            }
            if (j < n) {
                let amountLine = lines[j].trim();
                const isAmount = /各/.test(amountLine) || /[\d零一两二三四五六七八九十百千万]+[米元块斤]?$/.test(amountLine);
                if (isAmount) {
                    let price = extractPriceLocal(amountLine);
                    if (price > 0) {
                        let combined = numberLines.map(l => l.replace(/[\/\.\,\-\_]/g, ' ')).join(' ');
                        result.push(`${combined} 各 ${price}`);
                        i = j + 1;
                        continue;
                    }
                }
            }
            for (let nl of numberLines) result.push(nl);
            i = j;
        } else {
            result.push(line);
            i++;
        }
    }
    return result.join('\n');
}

function preprocessDashMoneyPattern(text) {
    if (!text) return text;
    return text.replace(/(\d{1,2})[一—\-－]\s*(\d+)\s*米\s*[澳港门香]?/g, '$1 各 $2');
}

function expandDotSeparatedTails(text) {
    const regex = /(?:平特尾?|平特\s*[：:，,。、；;]?\s*)?(\d+(?:[.,。，/]\d+)+)尾\s*(?:各|各数|各号|一个数|一个号)\s*(\d+|[零一两二三四五六七八九十百千万]+)(?:\s*[^＃#\d]*)?[＃#]?/g;
    function extractPriceNumber(amountStr) {
        let num = parseInt(amountStr, 10);
        if (!isNaN(num)) return num;
        const chn = {零:0,一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10,百:100,千:1000,万:10000};
        let total = 0, temp = 0;
        for (let ch of amountStr) {
            let val = chn[ch];
            if (val === undefined) return NaN;
            if (val >= 10) {
                if (temp === 0) temp = 1;
                total += temp * val;
                temp = 0;
            } else {
                temp = temp * 10 + val;
            }
        }
        total += temp;
        return total;
    }
    return text.replace(regex, (match, numbersStr, amountStr) => {
        const digits = numbersStr.split(/[.,。，/]/).map(Number);
        const amount = extractPriceNumber(amountStr);
        if (digits.every(d => !isNaN(d) && d >= 0 && d <= 9) && amount > 0) {
            const hasPingte = /平特/.test(match);
            const linePrefix = hasPingte ? '平特尾 ' : '';
            return digits.map(d => `${linePrefix}${d}尾 各 ${amount}`).join('\n');
        }
        return match;
    });
}

function normalizeBetText(text) {
    text = expandDotSeparatedTails(text);
    text = preprocessDashMoneyPattern(text);
    if (!text) return text;
    const rawLines = text.split(/\r?\n/);
    const convertedLines = rawLines.map(line => {
        return line.replace(/\b(\d{1,2})\/(\d{2,3})\b/g, (match, numStr, amountStr) => {
            const num = parseInt(numStr, 10);
            const amount = parseInt(amountStr, 10);
            if (num >= 1 && num <= 49 && amount > 49) {
                return `${numStr} 各 ${amount}`;
            }
            return match;
        });
    });
    text = convertedLines.join('\n');
    text = text.replace(/一个数/g, '各');
    text = text.replace(/每个数/g, '各');
    text = text.replace(/^[澳奥门][:：\s]*/gm, '澳门 ');
    text = text.replace(/^[香港][:：\s]*/gm, '香港 ');
    text = preprocessMultiLineNumberBlocks(text);
    const rightMarkers = ['各数', '各号', '各', '买', '号'];
    const leftMarkers = ['￥', '¥', '#', '＃', '@', '米', '元', '块', '斤', '井'];
    const lines = text.split(/\r?\n/);
    const resultLines = [];

    function splitLineByMultipleGe(line) {
        const gePattern = /(.+?)(各|各号|各数)\s*(\d+|[零一两二三四五六七八九十百千万]+)\s*[井元块斤]?/g;
        const matches = [];
        let match;
        while ((match = gePattern.exec(line)) !== null) {
            let desc = match[1].trim();
            let priceStr = match[3];
            let price = extractPriceNumber(priceStr);
            if (price > 0 && desc) {
                desc = desc.replace(/[，,、.\/\\_\-]+$/, '').trim();
                matches.push(`${desc} 各 ${price}`);
            }
        }
        return matches;
    }

    for (let originalLine of lines) {
        let line = originalLine.trim();
        if (!line) continue;

        const subLines = splitLineByMultipleGe(line);
        if (subLines.length > 1) {
            resultLines.push(...subLines);
            continue;
        }

        if (line.includes('=') && !line.includes('各')) {
            let cleaned = line.replace(/[，,、\s]+/g, ',');
            let segments = cleaned.split(',').filter(s => s.includes('='));
            let hasValid = false;
            for (let seg of segments) {
                let eqIdx = seg.indexOf('=');
                if (eqIdx === -1) continue;
                let desc = seg.substring(0, eqIdx).trim();
                let priceStr = seg.substring(eqIdx + 1).trim();
                let price = extractPriceNumber(priceStr);
                if (price > 0 && desc) {
                    desc = cleanDescPrefix(desc);
                    desc = splitFourDigitNumbers(desc);
                    resultLines.push(`${desc} 各 ${price}`);
                    hasValid = true;
                }
            }
            if (hasValid) continue;
        }
        let stripped = line.replace(/\s/g, '');
        if (/^\d+(?:=\d+)+$/.test(stripped)) {
            let pairs = line.match(/(\d+)\s*=\s*(\d+)/g);
            if (pairs) for (let pair of pairs) {
                let match = pair.match(/(\d+)\s*=\s*(\d+)/);
                if (match) {
                    let num = match[1];
                    let price = parseInt(match[2], 10);
                    if (price > 0) resultLines.push(`${num} 各 ${price}`);
                }
            }
            continue;
        }
        line = line.replace(/[（(）)]/g, ' ');
        line = line.replace(/不准、不开心制作|共\d+[米元]|第\d+期：?/g, '');
        line = line.replace(/[。，！？]+$/g, '');
        line = line.replace(/(\d+)[一](\d+)(米|元|块|斤|井)/g, '$1 各 $2$3');
        const pricePositions = [];
        let searchPos = 0;
        while (searchPos < line.length) {
            let found = false;
            for (let marker of rightMarkers) {
                let idx = line.indexOf(marker, searchPos);
                if (idx !== -1) {
                    let after = line.substring(idx + marker.length);
                    let priceMatch = after.match(/^(\d+|[零一两二三四五六七八九十百千万]+)/);
                    if (priceMatch) {
                        let price = extractPriceNumber(priceMatch[1]);
                        if (price > 0) {
                            pricePositions.push({
                                type: 'right',
                                markerIdx: idx,
                                markerLen: marker.length,
                                priceStart: idx + marker.length,
                                priceEnd: idx + marker.length + priceMatch[0].length,
                                price: price
                            });
                            searchPos = idx + marker.length + priceMatch[0].length;
                            found = true;
                            break;
                        }
                    }
                }
            }
            if (found) continue;
            for (let marker of leftMarkers) {
                let idx = line.indexOf(marker, searchPos);
                if (idx !== -1) {
                    let before = line.substring(0, idx);
                    let priceMatch = before.match(/(\d+|[零一两二三四五六七八九十百千万]+)\s*$/);
                    if (priceMatch) {
                        let price = extractPriceNumber(priceMatch[1]);
                        if (price > 0) {
                            let priceStartIdx = before.length - priceMatch[0].length;
                            pricePositions.push({
                                type: 'left',
                                markerIdx: idx,
                                markerLen: marker.length,
                                priceStart: priceStartIdx,
                                priceEnd: idx,
                                price: price
                            });
                            searchPos = idx + marker.length;
                            found = true;
                            break;
                        }
                    }
                }
            }
            if (found) continue;
            let eqIdx = line.indexOf('=', searchPos);
            if (eqIdx !== -1) {
                let leftPart = line.substring(0, eqIdx).trim();
                let rightPart = line.substring(eqIdx + 1).trim();
                let priceMatch = rightPart.match(/^(\d+|[零一两二三四五六七八九十百千万]+)/);
                if (priceMatch) {
                    let price = extractPriceNumber(priceMatch[1]);
                    if (price > 0 && leftPart) {
                        pricePositions.push({
                            type: 'eq',
                            markerIdx: eqIdx,
                            markerLen: 1,
                            priceStart: eqIdx + 1,
                            priceEnd: eqIdx + 1 + priceMatch[0].length,
                            price: price,
                            descOverride: leftPart
                        });
                        searchPos = eqIdx + 1 + priceMatch[0].length;
                        continue;
                    }
                }
            }
            let unitMatch = line.substring(searchPos).match(/(\d+|[零一两二三四五六七八九十百千万]+)\s*(米|元|块|斤|井)/);
            if (unitMatch) {
                let price = extractPriceNumber(unitMatch[1]);
                if (price > 0) {
                    let absoluteStart = searchPos + unitMatch.index;
                    let priceStart = absoluteStart;
                    let priceEnd = absoluteStart + unitMatch[0].length;
                    pricePositions.push({
                        type: 'unit',
                        markerIdx: priceEnd - unitMatch[2].length,
                        markerLen: unitMatch[2].length,
                        priceStart: priceStart,
                        priceEnd: priceEnd,
                        price: price
                    });
                    searchPos = priceEnd;
                    continue;
                }
            }
            let zodiacMatch = line.substring(searchPos).match(/[鼠牛虎兔龙蛇马羊猴鸡狗猪]+/);
            if (zodiacMatch && zodiacMatch.index === 0) {
                let tempDesc = zodiacMatch[0];
                let rest = line.substring(searchPos + tempDesc.length);
                let priceMatch = rest.match(/(\d+|[零一两二三四五六七八九十百千万]+)\s*(米|元|块|斤|#|＃|@|各)/);
                if (priceMatch) {
                    let price = extractPriceNumber(priceMatch[1]);
                    if (price > 0) {
                        let absoluteStart = searchPos + tempDesc.length + priceMatch.index;
                        let priceStart = absoluteStart;
                        let priceEnd = absoluteStart + priceMatch[0].length;
                        pricePositions.push({
                            type: 'zodiac',
                            markerIdx: priceEnd - priceMatch[1].length,
                            markerLen: priceMatch[1].length,
                            priceStart: priceStart,
                            priceEnd: priceEnd,
                            price: price,
                            descOverride: tempDesc
                        });
                        searchPos = priceEnd;
                        continue;
                    }
                }
            }
            break;
        }
        if (pricePositions.length === 0) {
            if (line.trim()) resultLines.push(line);
            continue;
        }
        let lastEnd = 0;
        for (let i = 0; i < pricePositions.length; i++) {
            const p = pricePositions[i];
            let desc = '';
            if (p.descOverride) desc = p.descOverride;
            else {
                let startIdx = lastEnd;
                let endIdx = p.type === 'right' ? p.markerIdx : (p.type === 'left' ? p.priceStart : p.markerIdx);
                if (endIdx < startIdx) endIdx = startIdx;
                let rawDesc = line.substring(startIdx, endIdx).trim();
                if (!rawDesc && i > 0 && pricePositions[i-1].descOverride) rawDesc = pricePositions[i-1].descOverride;
                desc = rawDesc;
            }
            if (desc) {
                desc = desc.replace(/[\/\-]$/, '').trim();
                desc = cleanDescPrefix(desc);
                desc = splitFourDigitNumbers(desc);
                resultLines.push(`${desc} 各 ${p.price}`);
            }
            lastEnd = p.priceEnd;
        }
    }
    return resultLines.join('\n');
}

function convertImplicitIntersection(text) {
    if (!text) return text;
    const categories = ['野兽', '家禽', '吉美', '凶丑', '天肖', '地肖', '左肖', '右肖', '前肖', '后肖', '阴肖', '阳肖','男肖','女肖'];
    const multiColorPattern = new RegExp(`(${categories.join('|')})([红蓝绿]{2,})波`, 'g');
    let result = text.replace(multiColorPattern, (match, category, colors) => {
        const colorArray = colors.split('');
        const expanded = colorArray.map(c => `${category}∩${c}波`).join(' ');
        return expanded;
    });
    const multiColorAttrPattern = new RegExp(`(${categories.join('|')})([红蓝绿]{2,})(单|双|大|小)`, 'g');
    const attrMap = { '单': '单数', '双': '双数', '大': '大数', '小': '小数' };
    result = result.replace(multiColorAttrPattern, (match, category, colors, attr) => {
        const colorArray = colors.split('');
        const fullAttr = attrMap[attr] || attr;
        const expanded = colorArray.map(c => `${category}∩${c}${fullAttr}`).join(' ');
        return expanded;
    });
    const attributes = ['红波', '蓝波', '绿波', '红', '蓝', '绿', '单数', '双数', '大数', '小数', '单', '双', '大', '小'];
    let changed = true;
    while (changed) {
        changed = false;
        for (let cat of categories) {
            for (let attr of attributes) {
                const regex = new RegExp(`(${cat})\\s*(${attr})(?!∩)`, 'g');
                const newResult = result.replace(regex, (match, c, a) => {
                    changed = true;
                    return `${c}∩${a}`;
                });
                result = newResult;
            }
        }
    }
    return result;
}

function extractValidFromGarbage(part) {
    if (!part) return null;

    const numMatch = part.match(/\d{1,2}/);
    if (numMatch) {
        const num = parseInt(numMatch[0], 10);
        if (isValid(num)) return { numbersSet: new Set([num]), displayText: pad2(num) };
    }

    const sortedTokens = [...allTokens].sort((a, b) => b.length - a.length);
    for (let token of sortedTokens) {
        if (part.includes(token)) {
            const nums = getNumbersSetForToken(token);
            if (nums.size) {
                return { numbersSet: nums, displayText: token };
            }
        }
    }

    const anyNum = part.match(/\d{1,2}/);
    if (anyNum) {
        const num = parseInt(anyNum[0], 10);
        if (isValid(num)) return { numbersSet: new Set([num]), displayText: pad2(num) };
    }
    return null;
}

function parseSinglePart(part) {
    if (/^\d+$/.test(part)) {
        let num = parseInt(part, 10);
        if (isValid(num)) return { numbersSet: new Set([num]), displayText: pad2(num) };
    }
    function processMultiColorWave(part) {
        let waveMatch = part.match(/^([红蓝绿]+)波$/);
        if (!waveMatch) return null;
        let colors = waveMatch[1].split('').filter(c => ['红','蓝','绿'].includes(c));
        if (colors.length < 2) return null;
        let allNumbers = new Set();
        let displays = [];
        for (let c of colors) {
            let token = c + '波';
            let nums = getNumbersSetForToken(token);
            if (nums.size) {
                nums.forEach(n => allNumbers.add(n));
                displays.push(token);
            }
        }
        if (!allNumbers.size) return null;
        return { numbersSet: allNumbers, displayText: displays.join(' ') };
    }
    function processColorWaveWithAttribute(part) {
        let match = part.match(/^([红蓝绿]+)波([大小单双])(?:数)?$/);
        if (!match) return null;
        let colors = match[1].split('').filter(c => ['红','蓝','绿'].includes(c));
        if (!colors.length) return null;
        let attr = match[2];
        let allNumbers = new Set();
        let displays = [];
        for (let c of colors) {
            let combo = c + attr;
            let nums = getNumbersSetForToken(combo);
            if (!nums.size) {
                let colorNums = getNumbersSetForToken(c + '波');
                let attrNums = getNumbersSetForToken(displayAlias[attr]);
                if (colorNums.size && attrNums.size) {
                    nums = new Set([...colorNums].filter(n => attrNums.has(n)));
                }
            }
            if (nums.size) {
                nums.forEach(n => allNumbers.add(n));
                displays.push(combo);
            }
        }
        if (!allNumbers.size) return null;
        return { numbersSet: allNumbers, displayText: displays.join(' ') };
    }
    function processColorAttribute(part) {
        const sortedColorTokens = ['红波','蓝波','绿波','红','蓝','绿'].sort((a,b)=>b.length-a.length);
        const singleToDouble = { '红': '红波', '蓝': '蓝波', '绿': '绿波' };
        let i = 0, found = [];
        let temp = part;
        while (i < temp.length) {
            let matched = false;
            for (let token of sortedColorTokens) {
                if (temp.startsWith(token, i)) {
                    found.push(token);
                    i += token.length;
                    matched = true;
                    break;
                }
            }
            if (!matched) break;
        }
        if (!found.length) return null;
        let remaining = part;
        for (let t of found) remaining = remaining.replace(t, '');
        let attr = null;
        for (let a of attrsList) {
            if (remaining.includes(a)) {
                attr = a;
                remaining = remaining.replace(a, '');
                break;
            }
        }
        if (remaining.trim().length > 0) return null;
        let normalized = found.map(t => singleToDouble[t] || t);
        let allNumbers = new Set();
        let displays = [];
        for (let idx = 0; idx < found.length; idx++) {
            let original = found[idx];
            let colorToken = normalized[idx];
            let tokenToUse = attr ? colorToken + attr : colorToken;
            let nums = getNumbersSetForToken(tokenToUse);
            if (!nums.size && attr) {
                let colorNums = getNumbersSetForToken(colorToken);
                let attrNums = getNumbersSetForToken(displayAlias[attr] || attr);
                if (colorNums.size && attrNums.size) nums = new Set([...colorNums].filter(n => attrNums.has(n)));
            }
            if (nums.size) {
                nums.forEach(n => allNumbers.add(n));
                if (attr) {
                    let shortColor = (original.endsWith('波') ? original[0] : original);
                    displays.push(shortColor + attr);
                } else {
                    displays.push(colorToken);
                }
            }
        }
        if (!allNumbers.size) return null;
        return { numbersSet: allNumbers, displayText: displays.join(' ') };
    }
    let waveAttr = processColorWaveWithAttribute(part);
    if (waveAttr) return waveAttr;
    let wave = processMultiColorWave(part);
    if (wave) return wave;
    let colorAttr = processColorAttribute(part);
    if (colorAttr) return colorAttr;
    let pos = 0;
    let currentTokens = [];
    let partNumbers = null;
    while (pos < part.length) {
        let matched = false;
        let longCands = allTokens.filter(t => part.startsWith(t, pos) && t.length > 2);
        if (longCands.length) {
            longCands.sort((a,b)=>b.length-a.length);
            let token = longCands[0];
            let nums = getNumbersSetForToken(token);
            if (nums.size) {
                currentTokens.push(token);
                partNumbers = partNumbers ? new Set([...partNumbers].filter(n => nums.has(n))) : new Set(nums);
                pos += token.length;
                matched = true;
            }
        }
        if (!matched) {
            for (let token of allTokens) {
                if (token.length <= 2 && part.startsWith(token, pos)) {
                    let nums = getNumbersSetForToken(token);
                    if (nums.size) {
                        currentTokens.push(token);
                        partNumbers = partNumbers ? new Set([...partNumbers].filter(n => nums.has(n))) : new Set(nums);
                        pos += token.length;
                        matched = true;
                        break;
                    }
                }
            }
        }
        if (!matched) {
            let digitMatch = part.substring(pos).match(/\d{1,2}/);
            if (digitMatch) {
                let num = parseInt(digitMatch[0], 10);
                if (isValid(num)) {
                    currentTokens.push(pad2(num));
                    let numSet = new Set([num]);
                    partNumbers = partNumbers ? new Set([...partNumbers].filter(n => numSet.has(n))) : numSet;
                    pos += digitMatch[0].length;
                    matched = true;
                }
            }
        }
        if (!matched) break;
    }
    if (currentTokens.length && partNumbers && partNumbers.size) {
        let displayTokens = currentTokens.map(t => displayAlias[t] || t);
        let useCap = displayTokens.some(t => CATEGORIES.includes(t));
        if (useCap) {
            return { numbersSet: partNumbers, displayText: displayTokens.join('∩') };
        } else {
            return { numbersSet: partNumbers, displayText: displayTokens.join(' ') };
        }
    }
    let zodiacChars = [];
    let remaining = part;
    for (let ch of part) {
        if (ZODIAC_LIST.includes(ch)) {
            zodiacChars.push(ch);
            remaining = remaining.replace(ch, '');
        }
    }
    let numbers = [];
    let digitMatches = remaining.match(/\d{1,2}/g);
    if (digitMatches) {
        for (let m of digitMatches) {
            let n = parseInt(m, 10);
            if (isValid(n)) numbers.push(n);
        }
    }
    if (zodiacChars.length === 0 && numbers.length === 0) {
        const fallback = extractValidFromGarbage(part);
        if (fallback) return fallback;
        return { numbersSet: new Set(), displayText: part };
    }
    let zodiacNumbersSet = new Set();
    for (let ch of zodiacChars) {
        let nums = getNumbers(ch);
        if (nums && nums.length) nums.forEach(n => zodiacNumbersSet.add(n));
    }
    let finalNumbersSet = new Set(zodiacNumbersSet);
    numbers.forEach(n => finalNumbersSet.add(n));
    let displayParts = [];
    if (zodiacChars.length) displayParts.push(zodiacChars.join(' '));
    if (numbers.length) displayParts.push(numbers.map(n => pad2(n)).join(' '));
    if (finalNumbersSet.size) return { numbersSet: finalNumbersSet, displayText: displayParts.join(' ') };
    let cn = chineseToNumber(part);
    if (cn > 0 && isValid(cn)) return { numbersSet: new Set([cn]), displayText: pad2(cn) };
    let num = parseInt(part, 10);
    if (!isNaN(num) && isValid(num)) return { numbersSet: new Set([num]), displayText: pad2(num) };
    let digits = part.match(/\d{1,2}/g);
    if (digits) {
        let nums = digits.map(n => parseInt(n,10)).filter(n => isValid(n));
        if (nums.length) return { numbersSet: new Set(nums), displayText: nums.map(n => pad2(n)).join(' ') };
    }

    const fallback = extractValidFromGarbage(part);
    if (fallback) return fallback;
    return { numbersSet: new Set(), displayText: part };
}

function parseDescription(desc) {
    if (!desc) return { display: '', numbers: [] };
    let s = fullToHalf(desc);
    s = stripChineseNoise(s);
    s = s.replace(/(澳门|澳|奥门|门|香港|香|港)\s*/g, '');
    s = s.replace(/^[a-zA-Z\u4e00-\u9fa5]{0,5}?(?=[\d\u4e00-\u9fa5])/, '');
    s = s.replace(/各号码|一个数|各数|各号|各码|每数|每号|各\s*号/g, ' ');
    s = s.replace(/[,，、./\\+_%-]/g, ' ');
    let parts = s.split(/\s+/).filter(p => p);
    let displayParts = [];
    let allNumbers = [];
    const colorShort = { '红波': '红', '蓝波': '蓝', '绿波': '绿', '红': '红', '蓝': '蓝', '绿': '绿' };
    const attrShort = { '单数': '单', '双数': '双', '大数': '大', '小数': '小', '单': '单', '双': '双', '大': '大', '小': '小' };
    function formatDisplayText(displayText) {
        if (displayText.length <= 2) return displayText;
        for (let color of ['红波', '蓝波', '绿波', '红', '蓝', '绿']) {
            for (let attr of ['单数', '双数', '大数', '小数', '单', '双', '大', '小']) {
                if (displayText === color + attr || displayText === color + ' ' + attr) {
                    return (colorShort[color] || color[0]) + (attrShort[attr] || attr[0]);
                }
                if (displayText === attr + color || displayText === attr + ' ' + color) {
                    return (attrShort[attr] || attr[0]) + (colorShort[color] || color[0]);
                }
            }
        }
        if (CATEGORIES.includes(displayText)) return displayText;
        return displayText;
    }
    function expandMultiColorIntersection(part) {
        for (let cat of CATEGORIES) {
            const regex = new RegExp(`^(${cat})([红蓝绿]+)波$`);
            const match = part.match(regex);
            if (match) {
                const category = match[1];
                const colors = match[2].split('');
                return colors.map(color => `${category}∩${color}波`);
            }
        }
        return [part];
    }

    for (let part of parts) {
        if (/^[鼠牛虎兔龙蛇马羊猴鸡狗猪]+$/.test(part) && part.length > 1) {
            for (let ch of part) {
                displayParts.push(ch);
                let nums = getNumbers(ch);
                if (nums && nums.length) {
                    allNumbers.push(...nums);
                }
            }
            continue;
        }

        if (/^\d{1,2}$/.test(part)) {
            let num = parseInt(part, 10);
            if (isValid(num)) {
                displayParts.push(pad2(num));
                allNumbers.push(num);
                continue;
            }
        }

        let expandedParts = expandMultiColorIntersection(part);
        for (let expandedPart of expandedParts) {
            if (expandedPart.includes('∩')) {
                let subParts = expandedPart.split('∩').filter(p => p.trim());
                let combinedSet = null;
                let subDisplays = [];
                for (let sub of subParts) {
                    let { numbersSet, displayText } = parseSinglePart(sub);
                    if (numbersSet.size === 0) {
                        combinedSet = null;
                        break;
                    }
                    if (combinedSet === null) combinedSet = new Set(numbersSet);
                    else combinedSet = new Set([...combinedSet].filter(n => numbersSet.has(n)));
                    subDisplays.push(formatDisplayText(displayText));
                }
                if (combinedSet && combinedSet.size) {
                    let hasCategory = subParts.some(sub => CATEGORIES.includes(sub));
                    let connector = hasCategory ? '∩' : '';
                    displayParts.push(subDisplays.join(connector));
                    allNumbers.push(...Array.from(combinedSet));
                }
            } else {
                let { numbersSet, displayText } = parseSinglePart(expandedPart);
                if (numbersSet.size) {
                    displayParts.push(formatDisplayText(displayText));
                    allNumbers.push(...Array.from(numbersSet));
                }
            }
        }
    }
    return { display: displayParts.join(' '), numbers: allNumbers };
}

function parseRangeLine(line) {
    let match1 = line.match(/(\d{1,2})\s*(?:到|至)\s*(\d{1,2})\s+(\d+|[零一两二三四五六七八九十百千万]+)[￥¥#]?$/);
    if (match1) {
        let start = parseInt(match1[1], 10);
        let end   = parseInt(match1[2], 10);
        let price = extractPrice(match1[3]);
        if (isNaN(start) || isNaN(end) || start < 1 || end > 49 || start > end || price <= 0) return null;
        let numbers = [];
        for (let i = start; i <= end; i++) numbers.push(i);
        let displayNumbers = numbers.map(n => pad2(n)).join(' ');
        let total = numbers.length * price;
        return [{ displayItems: displayNumbers, numbers, price, total }];
    }
    let match2 = line.match(/(\d{1,2})\s*(?:到|至)\s*(\d{1,2})\s*各\s*([零一两二三四五六七八九十百千万]+|\d+)\s*[＃#]?$/);
    if (match2) {
        let start = parseInt(match2[1], 10);
        let end   = parseInt(match2[2], 10);
        let price = extractPrice(match2[3]);
        if (isNaN(start) || isNaN(end) || start < 1 || end > 49 || start > end || price <= 0) return null;
        let numbers = [];
        for (let i = start; i <= end; i++) numbers.push(i);
        let displayNumbers = numbers.map(n => pad2(n)).join(' ');
        let total = numbers.length * price;
        return [{ displayItems: displayNumbers, numbers, price, total }];
    }
    return null;
}

function parsePingteLine(line) {
    const trimmed = line.trim();
    if (!trimmed) return null;
    const pingteRegex = /^\[?(平特|平特肖|平特尾)\]?\s*(.*)/i;
    const match = trimmed.match(pingteRegex);
    if (!match) return null;
    let typeRaw = match[1].toLowerCase();
    let rest = match[2].trim();
    if (!rest) return null;
    rest = rest.replace(/[＃#￥¥元斤]$/, '').trim();
    let price = 0;
    let descPart = rest;
    const geMatch = rest.match(/(.+?)\s+各\s+(\d+|[零一两二三四五六七八九十百千万]+)\s*$/);
    if (geMatch) {
        descPart = geMatch[1].trim();
        price = extractPriceNumber(geMatch[2]);
    } else {
        const priceMatch = rest.match(/(\d+|[零一两二三四五六七八九十百千万]+)\s*$/);
        if (priceMatch) {
            price = extractPriceNumber(priceMatch[1]);
            descPart = rest.substring(0, priceMatch.index).trim();
        }
    }
    if (price <= 0) return null;
    let actualType = '';
    if (typeRaw === '平特肖') actualType = 'shengxiao';
    else if (typeRaw === '平特尾') actualType = 'tail';
    else {
        const hasTailChar = /尾/.test(descPart);
        if (hasTailChar) {
            const tailMatches = descPart.match(/\d+/g);
            if (tailMatches && tailMatches.some(d => parseInt(d) >= 0 && parseInt(d) <= 9)) {
                actualType = 'tail';
            } else {
                actualType = 'shengxiao';
            }
        } else {
            actualType = 'shengxiao';
        }
    }
    let keys = [];
    if (actualType === 'shengxiao') {
        const shengxiaoSet = new Set();
        for (let ch of descPart) {
            if (ZODIAC_LIST.includes(ch)) shengxiaoSet.add(ch);
        }
        if (shengxiaoSet.size === 0) {
            const parts = descPart.split(/[,，\s]+/);
            for (let p of parts) {
                if (ZODIAC_LIST.includes(p)) shengxiaoSet.add(p);
            }
        }
        keys = Array.from(shengxiaoSet);
        if (keys.length === 0) return null;
    } else {
        let tailStr = descPart.replace(/尾/g, '');
        const tailMatches = tailStr.match(/\d+/g);
        if (!tailMatches) return null;
        const tails = tailMatches.map(t => parseInt(t,10)).filter(t => t >= 0 && t <= 9);
        if (tails.length === 0) return null;
        keys = [...new Set(tails)];
    }
    const items = keys.map(key => {
        let displayItems = '';
        if (actualType === 'shengxiao') {
            displayItems = key;
        } else {
            displayItems = `${key}尾`;
        }
        return {
            displayItems: displayItems,
            numbers: [],
            price: price,
            total: price,
            pingteInfo: { type: actualType, key: key, amountPer: price }
        };
    });
    const total = items.reduce((s, it) => s + it.total, 0);
    return { items, total, pingteType: actualType, keys, pricePer: price };
}

function parseStandardizedText(text) {
    const lines = text.split(/\r?\n/);
    const allItems = [];
    let totalSum = 0;
    let pendingDesc = '';
    for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line) continue;
        const pingteResult = parsePingteLine(line);
        if (pingteResult) {
            pendingDesc = '';
            for (let item of pingteResult.items) {
                allItems.push(item);
                totalSum += item.total;
            }
            continue;
        }
        let rangeItems = parseRangeLine(line);
        if (rangeItems && rangeItems.length) {
            pendingDesc = '';
            for (let item of rangeItems) {
                allItems.push(item);
                totalSum += item.total;
            }
            continue;
        }
        if (line.includes('各')) {
            let fullLine = pendingDesc ? pendingDesc + ' ' + line : line;
            pendingDesc = '';
            let match = fullLine.match(/^(.+?)\s+各\s+(\d+|[零一两二三四五六七八九十百千万]+)$/);
            if (match) {
                let desc = match[1].trim();
                let price = extractPrice(match[2]);
                if (price > 0 && desc) {
                    const { display, numbers } = parseDescription(desc);
                    if (numbers.length) {
                        const total = numbers.length * price;
                        allItems.push({ displayItems: display, numbers: numbers, price: price, total: total });
                        totalSum += total;
                    }
                }
            }
        } else {
            pendingDesc += (pendingDesc ? ' ' : '') + line;
        }
    }
    if (pendingDesc) {
        let price = null;
        let desc = null;
        const lastNumberMatch = pendingDesc.match(/(\d+|[零一两二三四五六七八九十百千万]+)\s*$/);
        if (lastNumberMatch) {
            price = extractPrice(lastNumberMatch[1]);
            desc = pendingDesc.substring(0, lastNumberMatch.index).trim();
        }
        if (price !== null && price > 0 && desc) {
            const { display, numbers } = parseDescription(desc);
            if (numbers.length) {
                const total = numbers.length * price;
                allItems.push({ displayItems: display, numbers: numbers, price: price, total: total });
                totalSum += total;
            }
        }
    }
    return { items: allItems, total: totalSum };
}

function parseRawLineSimple(line) {
    const trimmed = line.trim();
    if (!trimmed) return null;
    const rightMarkers = ['每个数', '每数各', '每数','各数', '各号', '各', '买'];
    const leftMarkers = ['￥', '¥', '#', '＃', '@', '米', '元', '块', '斤', '井'];
    function detectHongKong(str) {
        const s = str.trim();
        if (s === '香港' || s === '香' || s === '港') return true;
        return false;
    }
    let desc = null;
    let price = null;
    let isHongKong = false;
    for (let marker of rightMarkers) {
        const idx = trimmed.indexOf(marker);
        if (idx !== -1) {
            const before = trimmed.substring(0, idx).trim();
            const after = trimmed.substring(idx + marker.length).trim();
            const priceMatch = after.match(/^(\d+|[零一两二三四五六七八九十百千万]+)/);
            if (priceMatch) {
                const priceNum = extractPriceNumber(priceMatch[1]);
                if (priceNum > 0) {
                    desc = before;
                    price = priceNum;
                    const rest = after.substring(priceMatch[0].length).trim();
                    if (detectHongKong(rest)) isHongKong = true;
                    break;
                }
            }
        }
    }
    if (!desc) {
        for (let marker of leftMarkers) {
            const idx = trimmed.indexOf(marker);
            if (idx !== -1) {
                const before = trimmed.substring(0, idx).trim();
                const after = trimmed.substring(idx + marker.length).trim();
                const priceMatch = before.match(/(\d+|[零一两二三四五六七八九十百千万]+)\s*$/);
                if (priceMatch) {
                    const priceNum = extractPriceNumber(priceMatch[1]);
                    if (priceNum > 0) {
                        desc = after;
                        price = priceNum;
                        if (detectHongKong(desc)) {
                            isHongKong = true;
                            desc = desc.replace(/香港|香|港$/, '').trim();
                        }
                        break;
                    }
                }
            }
        }
    }
    if (!desc) {
        const eqIdx = trimmed.indexOf('=');
        if (eqIdx !== -1) {
            const leftPart = trimmed.substring(0, eqIdx).trim();
            const rightPart = trimmed.substring(eqIdx + 1).trim();
            const priceMatch = rightPart.match(/^(\d+|[零一两二三四五六七八九十百千万]+)/);
            if (priceMatch) {
                const priceNum = extractPriceNumber(priceMatch[1]);
                if (priceNum > 0 && leftPart) {
                    desc = leftPart;
                    price = priceNum;
                    const rest = rightPart.substring(priceMatch[0].length).trim();
                    if (detectHongKong(rest)) isHongKong = true;
                }
            }
        }
    }
    if (!desc) {
        const unitMatch = trimmed.match(/(\d+|[零一两二三四五六七八九十百千万]+)\s*(米|元|块|斤|井)\s*$/);
        if (unitMatch) {
            const priceNum = extractPriceNumber(unitMatch[1]);
            if (priceNum > 0) {
                desc = trimmed.substring(0, unitMatch.index).trim();
                price = priceNum;
                if (detectHongKong(desc)) {
                    isHongKong = true;
                    desc = desc.replace(/香港|香|港$/, '').trim();
                }
            }
        }
    }
    if (!desc || !price) return null;
    if (detectHongKong(desc)) {
        isHongKong = true;
        desc = desc.replace(/香港|香|港$/, '').trim();
    }
    const { display, numbers } = parseDescription(desc);
    if (!numbers.length) return null;
    const total = numbers.length * price;
    const items = [{ displayItems: display, numbers: numbers, price: price, total: total }];
    return { items, total, detectedHongKong: isHongKong };
}

function parseMixedBetText(fullText) {
    if (!fullText || fullText.trim() === '') return null;
    const hasMacau = /澳门|澳|奥|门/.test(fullText);
    const hasHK = /香港|香|港/.test(fullText);
    if (!hasMacau || !hasHK) return null;

    function removeRegionKeywords(text, region) {
        if (region === 'macau') return text.replace(/澳门|澳|奥|门/g, '').trim();
        else return text.replace(/香港|香|港/g, '').trim();
    }

    const lines = fullText.split(/\r?\n/);
    const segments = [];
    let currentRegion = null;
    let currentTextLines = [];
    let pendingLines = [];

    function flushCurrentRegion() {
        if (currentRegion && currentTextLines.length) {
            const rawText = currentTextLines.join('\n');
            segments.push({ region: currentRegion, text: rawText });
        }
        currentRegion = null;
        currentTextLines = [];
    }

    function handleMixedLine(trimmed) {
        let parts = [];
        const allMatches = [];
        let match;
        const macauRegex = /澳门|澳|奥|门/g;
        const hkRegex = /香港|香|港/g;
        while ((match = macauRegex.exec(trimmed)) !== null) allMatches.push({ region: 'macau', index: match.index, length: match[0].length });
        while ((match = hkRegex.exec(trimmed)) !== null) allMatches.push({ region: 'hongkong', index: match.index, length: match[0].length });
        allMatches.sort((a,b) => a.index - b.index);
        for (let i = 0; i <= allMatches.length; i++) {
            const start = i === 0 ? 0 : allMatches[i-1].index + allMatches[i-1].length;
            const end = i < allMatches.length ? allMatches[i].index : trimmed.length;
            if (start < end) {
                let partText = trimmed.substring(start, end).trim();
                if (partText) {
                    const region = i === 0 ? (allMatches[0]?.region || null) : allMatches[i-1].region;
                    if (region) {
                        parts.push({ region, text: partText });
                    }
                }
            }
        }
        for (let part of parts) {
            segments.push({ region: part.region, text: part.text });
        }
    }

    for (let line of lines) {
        const trimmed = line.trim();
        if (trimmed === '') {
            flushCurrentRegion();
            pendingLines = [];
            currentRegion = null;
            currentTextLines = [];
            continue;
        }

        const hasMacauInLine = /澳门|澳|奥|门/.test(trimmed);
        const hasHKInLine = /香港|香|港/.test(trimmed);

        if (hasMacauInLine && hasHKInLine) {
            flushCurrentRegion();
            if (pendingLines.length) {
                pendingLines = [];
            }
            handleMixedLine(trimmed);
            currentRegion = null;
            currentTextLines = [];
            continue;
        }

        if (hasMacauInLine || hasHKInLine) {
            const targetRegion = hasMacauInLine ? 'macau' : 'hongkong';
            flushCurrentRegion();
            let cleaned = removeRegionKeywords(trimmed, targetRegion);
            if (pendingLines.length) {
                const pendingText = pendingLines.join('\n');
                cleaned = pendingText + '\n' + cleaned;
                pendingLines = [];
            }
            currentRegion = targetRegion;
            currentTextLines = [cleaned];
            continue;
        }

        if (currentRegion !== null) {
            currentTextLines.push(trimmed);
        } else {
            pendingLines.push(trimmed);
        }
    }

    flushCurrentRegion();

    if (segments.length === 0) return null;

    const mergedSegments = [];
    for (let seg of segments) {
        if (mergedSegments.length === 0 || mergedSegments[mergedSegments.length-1].region !== seg.region) {
            mergedSegments.push({ region: seg.region, text: seg.text });
        } else {
            mergedSegments[mergedSegments.length-1].text += '\n' + seg.text;
        }
    }

    function parseRegionBlock(region, text) {
        let cleaned = text.replace(/[#＃]/g, ' ').replace(/\//g, ' ');
        let normalized = normalizeBetText(cleaned);
        normalized = convertImplicitIntersection(normalized);
        const { items, total } = parseStandardizedText(normalized);
        return { items, total, rawText: text };
    }

    const macauBlocks = mergedSegments.filter(s => s.region === 'macau').map(s => s.text);
    const hongkongBlocks = mergedSegments.filter(s => s.region === 'hongkong').map(s => s.text);

    let macauItems = [], hongkongItems = [];
    let macauTotal = 0, hongkongTotal = 0;
    let macauRaw = [], hongkongRaw = [];

    for (let block of macauBlocks) {
        const { items, total, rawText } = parseRegionBlock('macau', block);
        macauItems.push(...items);
        macauTotal += total;
        macauRaw.push(rawText);
    }
    for (let block of hongkongBlocks) {
        const { items, total, rawText } = parseRegionBlock('hongkong', block);
        hongkongItems.push(...items);
        hongkongTotal += total;
        hongkongRaw.push(rawText);
    }

    if (macauItems.length === 0 && hongkongItems.length === 0) return null;

    return {
        isMixed: true,
        macau: {
            items: macauItems,
            total: macauTotal,
            rawPreview: macauRaw.join('\n\n')
        },
        hongkong: {
            items: hongkongItems,
            total: hongkongTotal,
            rawPreview: hongkongRaw.join('\n\n')
        }
    };
}

function formatMixedPreview(mixed) {
    const parts = [];
    if (mixed.macau.items.length) {
        parts.push('🇲🇴 澳门');
        const macauLines = mixed.macau.items.map(it => {
            if (it.pingteInfo) {
                const typeLabel = it.pingteInfo.type === 'shengxiao' ? '[平特肖]' : '[平特尾]';
                return `${typeLabel} ${it.displayItems} 各${it.price} （${it.total}）`;
            } else {
                return `[每注] ${it.displayItems} 各${it.price} （${it.total}）`;
            }
        });
        parts.push(...macauLines);
    }
    if (mixed.hongkong.items.length) {
        if (parts.length) parts.push('');
        parts.push('🇭🇰 香港');
        const hongkongLines = mixed.hongkong.items.map(it => {
            if (it.pingteInfo) {
                const typeLabel = it.pingteInfo.type === 'shengxiao' ? '[平特肖]' : '[平特尾]';
                return `${typeLabel} ${it.displayItems} 各${it.price} （${it.total}）`;
            } else {
                return `[每注] ${it.displayItems} 各${it.price} （${it.total}）`;
            }
        });
        parts.push(...hongkongLines);
    }
    return parts.join('\n');
}

let currentParsed = null;
let lastSavedDataByRegion = { macau: null, hongkong: null };
let currentMixedParsed = null;

function detectHongKongInText(text) {
    const hkPattern = /香港|香|港/;
    return hkPattern.test(text);
}

function updateFloatParser() {
    const rawText = document.getElementById('parserInput').value;
    if (!rawText.trim()) {
        const resultEl = document.getElementById('parserResultMini');
        resultEl.innerText = '';
        resultEl.classList.remove('parser-warning');
        document.getElementById('parserTotalMini').innerText = '0';
        currentParsed = null;
        currentMixedParsed = null;
        return;
    }
    if (isAfterFeb62027()) {
        const resultEl = document.getElementById('parserResultMini');
        resultEl.innerText = '软件已更换新版，请联系作者更新。';
        resultEl.classList.add('parser-warning');
        document.getElementById('parserTotalMini').innerText = '---';
        currentParsed = null;
        currentMixedParsed = null;
        return;
    }
    const mixed = parseMixedBetText(rawText);
    if (mixed && mixed.isMixed && (mixed.macau.items.length || mixed.hongkong.items.length)) {
        currentMixedParsed = mixed;
        currentParsed = null;
        const preview = formatMixedPreview(mixed);
        const resultEl = document.getElementById('parserResultMini');
        resultEl.innerText = preview;
        resultEl.classList.remove('parser-warning');
        const totalMacau = mixed.macau.total;
        const totalHK = mixed.hongkong.total;
        document.getElementById('parserTotalMini').innerText = `澳门 ${totalMacau.toLocaleString()} 元 香港 ${totalHK.toLocaleString()}`;
        return;
    }
    currentMixedParsed = null;
    let text = normalizeBetText(rawText);
    text = convertImplicitIntersection(text);
    let { items, total } = parseStandardizedText(text);
    let usedOriginal = true;
    if (!items.length) {
        const lines = rawText.split(/\r?\n/);
        let allItems = [];
        let totalSum = 0;
        let hasHongKong = false;
        let allLinesMatched = true;
        for (let line of lines) {
            const trimmed = line.trim();
            if (!trimmed) continue;
            const result = parseRawLineSimple(trimmed);
            if (result) {
                allItems.push(...result.items);
                totalSum += result.total;
                if (result.detectedHongKong) hasHongKong = true;
            } else {
                allLinesMatched = false;
                break;
            }
        }
        if (allLinesMatched && allItems.length > 0) {
            items = allItems;
            total = totalSum;
            usedOriginal = false;
            const targetRegion = hasHongKong ? 'hongkong' : 'macau';
            if (currentRegion !== targetRegion) {
                const tabElement = document.querySelector(`.nav-item[data-tab="${targetRegion}"]`);
                if (tabElement) tabElement.click();
            }
        }
    }
    const resultDiv = document.getElementById('parserResultMini');
    const totalSpan = document.getElementById('parserTotalMini');
    if (!items.length) {
        resultDiv.innerText = '';
        resultDiv.classList.remove('parser-warning');
        totalSpan.innerText = '0';
        currentParsed = null;
        return;
    }
    let out = items.map(it => {
        if (it.pingteInfo) {
            if (it.pingteInfo.type === 'shengxiao') return `[平特肖] ${it.displayItems} 各${it.price} （${it.total}）`;
            else return `[平特尾] ${it.displayItems} 各${it.price} （${it.total}）`;
        } else {
            return `[每注] ${it.displayItems} 各${it.price} （${it.total}）`;
        }
    });
    resultDiv.innerText = out.join('\n');
    resultDiv.classList.remove('parser-warning');
    totalSpan.innerText = total;
    currentParsed = { items, total, rawText: out.join('\n') };
    if (usedOriginal && items.length) {
        const hasHK = detectHongKongInText(rawText);
        const targetRegion = hasHK ? 'hongkong' : 'macau';
        if (currentRegion !== targetRegion) {
            const tabElement = document.querySelector(`.nav-item[data-tab="${targetRegion}"]`);
            if (tabElement) tabElement.click();
        }
    }
}

async function autoReadClipboardAndFill() {
    try {
        let text = '';
        if (window.NativeBridge && typeof NativeBridge.getClipboardText === 'function') text = NativeBridge.getClipboardText();
        else if (navigator.clipboard && navigator.clipboard.readText) text = await navigator.clipboard.readText();
        else return;
        if (text && text.trim()) {
            document.getElementById('parserInput').value = text;
            updateFloatParser();
        }
    } catch(e) { console.log("读取剪贴板失败", e); }
}

async function clearClipboard() {
    try {
        if (window.NativeBridge && typeof NativeBridge.copyToClipboard === 'function') NativeBridge.copyToClipboard('');
        else if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText('');
    } catch(e) { console.warn("清空剪贴板失败", e); }
}

function applyMixedToBoth(mixed) {
    if (mixed.macau.items.length) {
        const macauItems = mixed.macau.items;
        const macauTotal = mixed.macau.total;

        const batchUpdates = [];
        for (let it of macauItems) {
            if (it.pingteInfo) continue;
            const { numbers, price } = it;
            if (!numbers?.length || price <= 0) continue;
            for (let num of numbers) {
                if (num >= 1 && num <= 49) batchUpdates.push({ num, add: price });
            }
        }
        if (batchUpdates.length) {
            for (let { num, add } of batchUpdates) amounts.macau[num-1] += add;
            saveRegionAmounts('macau');
        }

        const pingteActions = [];
        for (let it of macauItems) {
            if (it.pingteInfo) PingteManager.applyItem(it, 'macau', pingteActions);
        }

        const descLines = macauItems.map(it => {
            if (it.pingteInfo) {
                if (it.pingteInfo.type === 'shengxiao') return `[平特肖] ${it.displayItems} 各${it.price}`;
                else return `[平特尾] ${it.displayItems} 各${it.price}`;
            } else {
                return `[每注] ${it.displayItems} 各${it.price}`;
            }
        });
        const description = descLines.join('\n');
        addBatchHistoryRecord('macau', description, macauTotal, true);

        lastSavedDataByRegion.macau = {
            items: macauItems,
            total: macauTotal,
            rawInput: mixed.macau.rawPreview,
            region: 'macau',
            timestamp: getFormattedTimestamp(),
            pingteActions: pingteActions.length ? pingteActions : null
        };
    }

    if (mixed.hongkong.items.length) {
        const hkItems = mixed.hongkong.items;
        const hkTotal = mixed.hongkong.total;
        const batchUpdates = [];
        for (let it of hkItems) {
            if (it.pingteInfo) continue;
            const { numbers, price } = it;
            if (!numbers?.length || price <= 0) continue;
            for (let num of numbers) {
                if (num >= 1 && num <= 49) batchUpdates.push({ num, add: price });
            }
        }
        if (batchUpdates.length) {
            for (let { num, add } of batchUpdates) amounts.hongkong[num-1] += add;
            saveRegionAmounts('hongkong');
        }
        const pingteActions = [];
        for (let it of hkItems) {
            if (it.pingteInfo) PingteManager.applyItem(it, 'hongkong', pingteActions);
        }
        const descLines = hkItems.map(it => {
            if (it.pingteInfo) {
                if (it.pingteInfo.type === 'shengxiao') return `[平特肖] ${it.displayItems} 各${it.price}`;
                else return `[平特尾] ${it.displayItems} 各${it.price}`;
            } else {
                return `[每注] ${it.displayItems} 各${it.price}`;
            }
        });
        const description = descLines.join('\n');
        addBatchHistoryRecord('hongkong', description, hkTotal, true);
        lastSavedDataByRegion.hongkong = {
            items: hkItems,
            total: hkTotal,
            rawInput: mixed.hongkong.rawPreview,
            region: 'hongkong',
            timestamp: getFormattedTimestamp(),
            pingteActions: pingteActions.length ? pingteActions : null
        };
    }

    renderCurrentView();
    if (PingteManager.isWindowOpen()) PingteManager.render();
}

    if (batchUpdates.length) {
        for (let { num, add } of batchUpdates) amounts[currentRegion][num-1] += add;
        saveRegionAmounts(currentRegion);
        renderCurrentView();
    }
    const descLines = currentParsed.items.map(it => {
        if (it.pingteInfo) {
            if (it.pingteInfo.type === 'shengxiao') return `[平特肖] ${it.displayItems} 各${it.price}`;
            else return `[平特尾] ${it.displayItems} 各${it.price}`;
        } else {
            return `[每注] ${it.displayItems} 各${it.price}`;
        }
    });
    const description = descLines.join('\n');
    addBatchHistoryRecord(currentRegion, description, totalToSave, true);
    lastSavedDataByRegion[region] = {
        items: itemsToSave,
        total: totalToSave,
        rawInput: rawInput,
        region: region,
        timestamp: getFormattedTimestamp(),
        pingteActions: pingteActions.length ? pingteActions : null
    };
    document.getElementById('parserInput').value = '';
    updateFloatParser();
    clearClipboard();
}

function undoLastSave() {
    const data = lastSavedDataByRegion[currentRegion];
    if (!data) { alert("没有可撤销的记录"); return; }
    showUndoConfirm(data, () => {
        let totalDeduct = 0;
        const changes = [];
        if (data.pingteActions && data.pingteActions.length) {
            const result = PingteManager.undoActions(data.pingteActions, currentRegion);
            totalDeduct += result.totalDeduct;
            changes.push(...result.changes);
        }
        for (let it of data.items) {
            if (it.pingteInfo) continue;
            const { numbers, price } = it;
            if (!numbers?.length || price <= 0) continue;
            for (let num of numbers) {
                if (num >= 1 && num <= 49) {
                    const idx = num - 1;
                    const oldVal = Number(amounts[currentRegion][idx]) || 0;
                    const newVal = Math.max(0, oldVal - price);
                    const deduct = oldVal - newVal;
                    if (deduct > 0) {
                        amounts[currentRegion][idx] = newVal;
                        totalDeduct += deduct;
                        changes.push(`${pad2(num)}=${deduct}`);
                    }
                }
            }
        }
        if (totalDeduct > 0) {
            if (!data.pingteActions) saveRegionAmounts(currentRegion);
            renderCurrentView();
            const description = `✏️ 撤销: ${data.rawInput} (原总金额 ${data.total}) 扣减明细: ${changes.join(' ')}`;
            addBatchHistoryRecord(currentRegion, description, totalDeduct, false);
            alert(`已成功撤销，共扣减 ${totalDeduct} 元`);
            lastSavedDataByRegion[currentRegion] = null;
        } else {
            alert("撤销失败：没有需要扣减的金额");
        }
    }, () => {});
}

let currentPrizeData = { macau: { records: [], total: 0, pingteTotal:0, pingteSxBetTotal:0, pingteTailBetTotal:0 }, hongkong: { records: [], total: 0, pingteTotal:0, pingteSxBetTotal:0, pingteTailBetTotal:0 } };
let currentDisplayRegionPrize = 'macau';

function isMixedRegionRecord(desc) {
    const hasMacau = /澳门|澳|门/.test(desc);
    const hasHK = /香港|港/.test(desc);
    return hasMacau && hasHK;
}

function getLatestDateFromHistory() {
    if (!historyRecords.length) return null;
    const sorted = [...historyRecords].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
    const latestTimestamp = sorted[0].timestamp;
    const datePart = latestTimestamp.split(' ')[0];
    const parts = datePart.split(/[\/\-]/);
    if (parts.length === 3) {
        let year = parseInt(parts[0]);
        let month = parseInt(parts[1]);
        let day = parseInt(parts[2]);
        if (!isNaN(year) && !isNaN(month) && !isNaN(day)) {
            return { year, month, day };
        }
    }
    return null;
}

function isSameDate(timestamp, targetDate) {
    if (!targetDate) return false;
    const datePart = timestamp.split(' ')[0];
    const parts = datePart.split(/[\/\-]/);
    if (parts.length === 3) {
        let year = parseInt(parts[0]);
        let month = parseInt(parts[1]);
        let day = parseInt(parts[2]);
        return year === targetDate.year && month === targetDate.month && day === targetDate.day;
    }
    return false;
}

function parseRecordDescription(desc) {
    let clean = desc.replace(/^[📝📤]+\s*(添加投注|上报扣减|手动添加|手动扣减)\s*/, '').trim();

    let addMatch = clean.match(/^(\d{1,2})\s+添加\s+(\d+)$/);
    if (addMatch) {
        let num = parseInt(addMatch[1], 10);
        let price = parseInt(addMatch[2], 10);
        if (num >= 1 && num <= 49 && price > 0) {
            return { type: 'normal', price, numbers: [num] };
        }
    }

    let sxMatch = clean.match(/^\[?平特肖\]?\s+([鼠牛虎兔龙蛇马羊猴鸡狗猪]+)\s+各\s*(\d+)$/);
    if (!sxMatch) {
        const numSxMatch = clean.match(/^\[?平特肖\]?\s+(\d{1,2})\s+各\s*(\d+)$/);
        if (numSxMatch) {
            const num = parseInt(numSxMatch[1], 10);
            const zodiac = zodiacMap[num];
            if (zodiac && num >= 1 && num <= 49) {
                sxMatch = [null, zodiac, numSxMatch[2]];
            }
        }
    }
    if (sxMatch) {
        let zodiac = sxMatch[1];
        let price = parseInt(sxMatch[2], 10);
        return { type: 'pingte_shengxiao', price, zodiac };
    }

    let tailMatch = clean.match(/^\[?平特尾\]?\s+(\d+)尾\s+各\s*(\d+)$/);
    if (tailMatch) {
        let tail = parseInt(tailMatch[1], 10);
        let price = parseInt(tailMatch[2], 10);
        return { type: 'pingte_tail', price, tail };
    }

    let price = 0;
    let descPart = clean;

    let geMatch = clean.match(/(.+)\s+各\s*(\d+)$/);
    if (geMatch) {
        descPart = geMatch[1].trim();
        price = parseInt(geMatch[2], 10);
    } else {
        let priceMatch = clean.match(/(\d+)$/);
        if (priceMatch) {
            price = parseInt(priceMatch[1], 10);
            descPart = clean.substring(0, priceMatch.index).trim();
        }
    }

    if (price <= 0) return null;

    descPart = descPart.replace(/^\[?每注\]?\s*/, '').trim();

    const { numbers } = parseDescription(descPart);
    if (numbers.length === 0) return null;

    return { type: 'normal', price, numbers };
}

function collectTailFromPanel(region) {
    const containerId = region === 'macau' ? 'macauSxInputs' : 'hongkongSxInputs';
    const container = document.getElementById(containerId);
    if (!container) return [];
    const inputs = container.querySelectorAll('.sx-input');
    const tailSet = new Set();
    for (let inp of inputs) {
        let val = inp.value.trim();
        if (!val) continue;
        let num = parseInt(val, 10);
        if (!isNaN(num) && num >= 1 && num <= 49) {
            let tail = num % 10;
            tailSet.add(tail);
        }
    }
    return Array.from(tailSet);
}

function collectSxFromPanel(region) {
    const containerId = region === 'macau' ? 'macauSxInputs' : 'hongkongSxInputs';
    const container = document.getElementById(containerId);
    if (!container) return [];
    const inputs = container.querySelectorAll('.sx-input');
    const sxSet = new Set();
    for (let inp of inputs) {
        let val = inp.value.trim();
        if (!val) continue;
        let num = parseInt(val, 10);
        if (!isNaN(num) && num >= 1 && num <= 49) {
            let sx = zodiacMap[num];
            if (sx) sxSet.add(sx);
        }
    }
    return Array.from(sxSet);
}

function isPingtePanelExpanded() {
    const panel = document.getElementById('pingteSxPanel');
    return panel && panel.style.display !== 'none';
}

async function exportPrizeToTxt() {
    const macauNum = parseInt(document.getElementById('macauNumber').value, 10);
    const hkNum = parseInt(document.getElementById('hongkongNumber').value, 10);
    const panelExpanded = isPingtePanelExpanded();
    const regions = [];
    if (currentDisplayRegionPrize === 'macau') {
        regions.push({ key: 'macau', name: '澳门', num: macauNum });
    } else {
        regions.push({ key: 'hongkong', name: '香港', num: hkNum });
    }
    let outputBlocks = [];
    for (let r of regions) {
        if (isNaN(r.num) || r.num < 1 || r.num > 49) continue;
        const data = currentPrizeData[r.key];
        if (!data || !data.records.length) continue;
        let sxList = panelExpanded ? collectSxFromPanel(r.key) : [];
        let tailList = panelExpanded ? collectTailFromPanel(r.key) : [];
        if (panelExpanded) {
            const sx = zodiacMap[r.num];
            if (sx && !sxList.includes(sx)) sxList.push(sx);
            const tail = r.num % 10;
            if (!tailList.includes(tail)) tailList.push(tail);
        }
        let totalNormalBet = 0, totalPingteBet = 0;
        let totalSpecialBet = 0, totalPingteSxPayout = 0, totalPingteTailPayout = 0;
        const normalDetails = [], pingteDetails = [];
        const specialWinAmounts = [];
        const pingtePayoutItems = [];
        const records = [...data.records].reverse();
        const currentNum = Number(r.num);
        let pingteSxBetTotal = 0, pingteTailBetTotal = 0;
        for (let rec of records) {
            let recSpecial = 0, recSx = 0, recTail = 0;
            let recNormalAmount = 0, recPingteAmount = 0;
            const linesDesc = rec.cleanDesc.split(/\r?\n/);
            const linePingteDetails = [];
            for (let line of linesDesc) {
                const parsed = parseRecordDescription(line.trim());
                if (!parsed) continue;
                if (parsed.type === 'normal') {
                    recNormalAmount += parsed.price * parsed.numbers.length;
                    for (let n of parsed.numbers) if (n === currentNum) recSpecial += parsed.price;
                } else if (parsed.type === 'pingte_shengxiao') {
                    const amount = parsed.price;
                    recPingteAmount += amount;
                    if (isSpecialZodiac(parsed.zodiac)) {
                        pingteTailBetTotal += amount;
                    } else {
                        pingteSxBetTotal += amount;
                    }
                    const isWin = sxList.includes(parsed.zodiac);
                    if (isWin) {
                        recSx += amount;
                        const isSpecial = isSpecialZodiac(parsed.zodiac);
                        const odds = isSpecial ? PINGTE_TAIL_ODDS : PINGTE_SX_ODDS;
                        const payout = amount * odds;
                        totalPingteSxPayout += payout;
                        pingtePayoutItems.push(payout);
                    }
                    const note = isWin ? `(肖中${isWin ? (amount * (isSpecialZodiac(parsed.zodiac) ? PINGTE_TAIL_ODDS : PINGTE_SX_ODDS)) : 0})` : '';
                    linePingteDetails.push(amount + note);
                } else if (parsed.type === 'pingte_tail') {
                    const amount = parsed.price;
                    recPingteAmount += amount;
                    if (parsed.tail === 0) {
                        pingteSxBetTotal += amount;
                    } else {
                        pingteTailBetTotal += amount;
                    }
                    const isWin = tailList.includes(parsed.tail);
                    if (isWin) {
                        recTail += amount;
                        const odds = (parsed.tail === SPECIAL_TAIL_NUMBERS) ? PINGTE_SX_ODDS : PINGTE_TAIL_ODDS;
                        const payout = amount * odds;
                        totalPingteTailPayout += payout;
                        pingtePayoutItems.push(payout);
                    }
                    const note = isWin ? `(尾中${isWin ? (amount * ((parsed.tail === SPECIAL_TAIL_NUMBERS) ? PINGTE_SX_ODDS : PINGTE_TAIL_ODDS)) : 0})` : '';
                    linePingteDetails.push(amount + note);
                }
            }
            if (recNormalAmount > 0) {
                totalNormalBet += recNormalAmount;
                let note = recSpecial > 0 ? `(中${recSpecial})` : '';
                normalDetails.push(recNormalAmount + note);
            }
            pingteDetails.push(...linePingteDetails);
            if (recPingteAmount > 0) {
                totalPingteBet += recPingteAmount;
            }
            specialWinAmounts.push(recSpecial);
            totalSpecialBet += recSpecial;
        }
        const totalBet = totalNormalBet + totalPingteBet;
        const pingteTotal = totalPingteSxPayout + totalPingteTailPayout;
        let lines = [];
        lines.push(`${r.name}投注：`);
        lines.push(normalDetails.length ? normalDetails.join('+') + '=' + totalNormalBet : '0');
        lines.push('');
        if (pingteDetails.length) {
            lines.push(`平特投注：`);
            lines.push(pingteDetails.join('+') + '=' + totalPingteBet);
            lines.push('');
        }
        const nonZeroSpecial = specialWinAmounts.filter(v => v > 0);
        lines.push(`特码中：`);
        lines.push(nonZeroSpecial.length ? nonZeroSpecial.join('+') + '=' + totalSpecialBet : '0');
        lines.push('');
        lines.push(`平特中：`);
        if (pingtePayoutItems.length) {
            lines.push(pingtePayoutItems.join('+') + '=' + pingteTotal);
        } else {
            lines.push('0');
        }
        lines.push('');
        const specialPayout = totalSpecialBet * oddsMultiplier;
        const normalWater = totalNormalBet * waterRate;
        const pingteSxWater = pingteSxBetTotal * pingteSxWaterRate;
        const pingteTailWater = pingteTailBetTotal * pingteTailWaterRate;
        const totalWater = normalWater + pingteSxWater + pingteTailWater;
        const net = totalBet - specialPayout - pingteTotal - totalWater;
        const forecast = data.forecastNet || 0;
        const finalNet = net - forecast;
        let forecastSymbol = '';
        if (forecast !== 0) {
            forecastSymbol = forecast > 0 ? ` - 预报${forecast}` : ` + 预报${-forecast}`;
        }
        lines.push(`合计：${totalBet} - 中${totalSpecialBet}×${oddsMultiplier} - 平特${pingteTotal} - 水${Math.round(totalWater)}${forecastSymbol} = ${Math.round(finalNet)}`);
        outputBlocks.push(lines.join('\n'));
    }
    if (outputBlocks.length === 0) {
        alert('没有可复制的兑奖记录');
        return;
    }
    const content = outputBlocks.join('\n\n');
    try {
        const ok = await safeCopyText(content);
        if (ok) {
            alert('✅ 兑奖记录已复制到剪贴板');
        } else {
            alert('❌ 复制失败，请手动复制');
        }
    } catch (e) {
        console.error('复制异常:', e);
        alert('❌ 复制失败，请手动复制');
    }
}

        let recNormalWin = 0;
        const recHitWins = [];
        const linesDesc = rec.cleanDesc.split(/\r?\n/);
        for (let line of linesDesc) {
